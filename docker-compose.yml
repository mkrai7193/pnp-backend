services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: pnp_sports
      MYSQL_USER: pnp
      MYSQL_PASSWORD: pnp
      MYSQL_ROOT_PASSWORD: root
    ports:
      - '3306:3306'
    volumes:
      - pnp-mysql-data:/var/lib/mysql

volumes:
  pnp-mysql-data:
