name: Backend CI/CD

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  build:
    name: Build & typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Typecheck (incl. scripts/)
        run: npx tsc --noEmit -p tsconfig.json

  deploy:
    name: Deploy to production
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          echo "${{ secrets.DEPLOY_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Ship release and deploy
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          set -euo pipefail
          SSH="ssh -i ~/.ssh/deploy_key -o UserKnownHostsFile=~/.ssh/known_hosts"
          RELEASE_ID="$(date -u +%Y%m%d%H%M%S)-${GITHUB_SHA::8}"

          echo "Creating release dir $RELEASE_ID"
          $SSH "$DEPLOY_USER@$DEPLOY_HOST" "mkdir -p /opt/pnp-backend/releases/$RELEASE_ID"

          echo "Shipping backend source"
          tar czf - \
            --exclude=node_modules --exclude=dist --exclude=.env \
            src scripts deploy package.json package-lock.json tsconfig.json tsconfig.build.json nest-cli.json \
            | $SSH "$DEPLOY_USER@$DEPLOY_HOST" "tar xzf - -C /opt/pnp-backend/releases/$RELEASE_ID"

          echo "Running remote deploy script"
          $SSH "$DEPLOY_USER@$DEPLOY_HOST" \
            "bash /opt/pnp-backend/releases/$RELEASE_ID/deploy/deploy-remote.sh $RELEASE_ID"

      - name: Verify live endpoint
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          curl -fsS --resolve "api.pnpsports.in:443:$DEPLOY_HOST" \
            https://api.pnpsports.in/api/schools -o /dev/null
          echo "Live endpoint OK"
